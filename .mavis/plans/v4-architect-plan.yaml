      ### server/src/routes/residents.ts
      ```typescript
      import { FastifyInstance } from 'fastify';
      import { residentRepository, memberRepository, keycardRepository } from '../db/repository.js';

      export default async function residentsRoutes(fastify: FastifyInstance) {
        fastify.get('/', async () => residentRepository.getAll());
        fastify.get<{ Params: { id: string } }>('/:id', async (request) => {
          const resident = residentRepository.getById(request.params.id);
          if (!resident) throw { statusCode: 404, message: '找不到住戶' };
          return resident;
        });
        fastify.post('/', async (request) => residentRepository.create(request.body as any));
        fastify.put<{ Params: { id: string } }>('/:id', async (request) => {
          return residentRepository.update(request.params.id, request.body as any);
        });
        fastify.delete<{ Params: { id: string } }>('/:id', async (request) => {
          residentRepository.delete(request.params.id);
          return { success: true };
        });
        fastify.get<{ Querystring: { q: string } }>('/search', async (request) => {
          return residentRepository.search(request.query.q || '');
        });

        // 成員路由
        fastify.get<{ Params: { id: string } }>('/:id/members', async (request) => {
          return memberRepository.getByResidentId(request.params.id);
        });
        fastify.post<{ Params: { id: string } }>('/:id/members', async (request) => {
          return memberRepository.create({ ...request.body as any, residentId: request.params.id });
        });
        fastify.delete<{ Params: { id: string }, Params2: { memberId: string } }>('/:id/members/:memberId', async (request) => {
          memberRepository.delete(request.params.memberId);
          return { success: true };
        });

        // 鑰匙卡路由
        fastify.get<{ Params: { id: string } }>('/:id/keycards', async (request) => {
          return keycardRepository.getByResidentId(request.params.id);
        });
        fastify.post<{ Params: { id: string } }>('/:id/keycards', async (request) => {
          return keycardRepository.create({ ...request.body as any, residentId: request.params.id });
        });
      }
      ```

