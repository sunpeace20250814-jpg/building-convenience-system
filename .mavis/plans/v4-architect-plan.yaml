version: 1
plan:
  name: '大樓住戶系統 V4 - 全新架構建構'
  description: '以班表OS為藍本，重建完整前後端住戶管理系統'
  max_concurrency: 3
  max_consecutive_failures: 2
  max_cycles: 15
  auto_reject_retries: 2

tasks:
  # ========================================
  # Phase 1: 專案初始化
  # ========================================
  - id: task-1-scaffold
    title: '建立 V4 專案架構藍圖'
    prompt: |
      ## 任務目標
      在 `C:\Users\sunpe\dev\v4-resident-system\` 建立一個全新的專案結構。

      ## 必須完成的交付物

      ### 1. 專案目錄結構
      參考 `C:\Users\sunpe\自主開發\班表OS\` 的架構模式，建立以下目錄：

      ```
      v4-resident-system/
      ├── client/                      # 前端 (React)
      │   ├── src/
      │   │   ├── components/         # 通用 UI 組件
      │   │   │   ├── ui/            # 基礎 UI 組件
      │   │   │   └── layout/        # 佈局組件
      │   │   ├── modules/            # 功能模組
      │   │   │   ├── residents/      # 住戶管理
      │   │   │   ├── expenses/       # 記帳系統
      │   │   │   ├── schedule/       # 班表日曆
      │   │   │   └── settings/       # 系統設定
      │   │   ├── stores/            # Zustand 狀態管理
      │   │   ├── db/                # Dexie.js 客戶端資料庫
      │   │   ├── hooks/             # 自訂 Hooks
      │   │   ├── lib/               # 工具函數
      │   │   ├── types/             # TypeScript 類型定義
      │   │   └── App.tsx
      │   ├── index.html
      │   └── package.json
      ├── server/                      # 後端 (Node.js + Fastify)
      │   ├── src/
      │   │   ├── db/                # better-sqlite3 資料庫
      │   │   ├── routes/            # API 路由
      │   │   ├── services/          # 業務邏輯
      │   │   └── index.ts           # 入口
      │   └── package.json
      ├── shared/                      # 共用類型
      │   ├── src/
      │   │   ├── types/
      │   │   └── validation/
      │   └── package.json
      ├── package.json               # 根 workspace
      ├── pnpm-workspace.yaml        # pnpm workspace 配置
      └── README.md
      ```

      ### 2. 根 package.json
      ```json
      {
        "name": "v4-resident-system",
        "version": "1.0.0",
        "private": true,
        "scripts": {
          "dev": "pnpm --parallel -r --filter='@v4-resident/*' run dev",
          "build": "pnpm -r run build",
          "start": "pnpm --parallel -r run start"
        }
      }
      ```

      ### 3. pnpm-workspace.yaml
      ```yaml
      packages:
        - 'client'
        - 'server'
        - 'shared'
      ```

