      ### shared/src/validation/index.ts
      為每個主要類型建立 Zod schema 驗證：

      ```typescript
      import { z } from 'zod';

      export const residentSchema = z.object({
        id: z.string(),
        buildingId: z.string(),
        floor: z.string(),
        unitType: z.enum(['normal', 'rental']),
        statusId: z.string(),
        ownerName: z.string().min(1),
        phone: z.string().optional(),
        email: z.string().email().optional(),
        // ... 其他欄位
      });

      export const createResidentSchema = residentSchema.omit({ id: true, createdAt: true, updatedAt: true });
      export const updateResidentSchema = createResidentSchema.partial();
      ```

      ### shared/src/index.ts
      統一匯出所有類型和驗證。

