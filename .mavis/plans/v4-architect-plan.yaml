  # ========================================
  # Phase 2: 共享類型定義
  # ========================================
  - id: task-2-shared-types
    title: '建立共享類型定義'
    prompt: |
      ## 任務目標
      在 `C:\Users\sunpe\dev\v4-resident-system\shared\src\` 建立完整的 TypeScript 類型和 Zod 驗證。

      ## 必須建立的檔案

      ### shared/src/types/index.ts
      建立完整的類型定義，涵蓋以下所有模組：

