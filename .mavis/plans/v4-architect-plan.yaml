      ```typescript
      const API_BASE = 'http://localhost:3001/api';

      async function fetchApi<T>(endpoint: string, options?: RequestInit): Promise<T> {
        const response = await fetch(`${API_BASE}${endpoint}`, {
          ...options,
          headers: { 'Content-Type': 'application/json', ...options?.headers }
        });
        if (!response.ok) throw new Error(`API Error: ${response.statusText}`);
        return response.json();
      }

      export const api = {
        residents: {
          getAll: () => fetchApi<any[]>('/residents'),
          getById: (id: string) => fetchApi<any>(`/residents/${id}`),
          create: (data: any) => fetchApi<any>('/residents', { method: 'POST', body: JSON.stringify(data) }),
          update: (id: string, data: any) => fetchApi<any>(`/residents/${id}`, { method: 'PUT', body: JSON.stringify(data) }),
          delete: (id: string) => fetchApi<any>(`/residents/${id}`, { method: 'DELETE' }),
          search: (q: string) => fetchApi<any[]>(`/residents/search?q=${encodeURIComponent(q)}`)
        },
        expenses: {
          getAll: () => fetchApi<any[]>('/expenses'),
          create: (data: any) => fetchApi<any>('/expenses', { method: 'POST', body: JSON.stringify(data) }),
          delete: (id: string) => fetchApi<any>(`/expenses/${id}`, { method: 'DELETE' })
        },
        schedule: {
          getAll: () => fetchApi<any[]>('/schedule'),
          create: (data: any) => fetchApi<any>('/schedule', { method: 'POST', body: JSON.stringify(data) }),
          update: (id: string, data: any) => fetchApi<any>(`/schedule/${id}`, { method: 'PUT', body: JSON.stringify(data) }),
          delete: (id: string) => fetchApi<any>(`/schedule/${id}`, { method: 'DELETE' })
        },
        settings: {
          getStatuses: () => fetchApi<any[]>('/settings/statuses'),
          getBuildings: () => fetchApi<any[]>('/settings/buildings'),
          getParkingSpots: () => fetchApi<any[]>('/settings/parking-spots')
        },
        homeTabs: {
          getAll: () => fetchApi<any[]>('/home-tabs'),
          create: (data: any) => fetchApi<any>('/home-tabs', { method: 'POST', body: JSON.stringify(data) }),
          delete: (id: string) => fetchApi<any>(`/home-tabs/${id}`, { method: 'DELETE' })
        }
      };
      ```

      ### client/src/stores/residentStore.ts
      Zustand Store：

      ```typescript
      import { create } from 'zustand';
      import { clientDb, api } from '../db';

      interface ResidentState {
        residents: any[];
        selectedResident: any | null;
        isLoading: boolean;
        error: string | null;
        loadResidents: () => Promise<void>;
        selectResident: (id: string | null) => Promise<void>;
        createResident: (data: any) => Promise<any>;
        updateResident: (id: string, data: any) => Promise<void>;
        deleteResident: (id: string) => Promise<void>;
      }

      export const useResidentStore = create<ResidentState>((set, get) => ({
        residents: [],
        selectedResident: null,
        isLoading: false,
        error: null,

        loadResidents: async () => {
          set({ isLoading: true, error: null });
          try {
            const serverResidents = await api.residents.getAll();
            await clientDb.residents.clear();
            await clientDb.residents.bulkPut(serverResidents);
            set({ residents: serverResidents });
          } catch (error) {
            // 回退到本地資料
            const localResidents = await clientDb.residents.toArray();
            set({ residents: localResidents, error: (error as Error).message });
          } finally {
            set({ isLoading: false });
          }
        },

        selectResident: async (id) => {
          if (!id) { set({ selectedResident: null }); return; }
          const resident = await clientDb.residents.get(id);
          set({ selectedResident: resident });
        },

        createResident: async (data) => {
          const newResident = await api.residents.create(data);
          await clientDb.residents.add(newResident);
          set((state) => ({ residents: [...state.residents, newResident] }));
          return newResident;
        },

        updateResident: async (id, data) => {
          await api.residents.update(id, data);
          await clientDb.residents.update(id, { ...data, updatedAt: new Date().toISOString() });
          await get().loadResidents();
        },

        deleteResident: async (id) => {
          await api.residents.delete(id);
          await clientDb.residents.delete(id);
          set((state) => ({
            residents: state.residents.filter(r => r.id !== id),
            selectedResident: state.selectedResident?.id === id ? null : state.selectedResident
          }));
        }
      }));
      ```

