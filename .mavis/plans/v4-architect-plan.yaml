  # ========================================
  # Phase 3: 後端資料庫
  # ========================================
  - id: task-3-backend-db
    title: '建立後端 SQLite 資料庫'
    prompt: |
      ## 任務目標
      在 `C:\Users\sunpe\dev\v4-resident-system\server\src\db\` 建立 better-sqlite3 資料庫層。

      ## 必須建立的檔案

      ### server/src/db/index.ts
      建立完整的資料庫初始化腳本：

      ```typescript
      import Database from 'better-sqlite3';
      import path from 'path';
      import { fileURLToPath } from 'url';
      import fs from 'fs';

      const __dirname = path.dirname(fileURLToPath(import.meta.url));
      const DATA_DIR = path.join(__dirname, '../../data');
      const DB_PATH = path.join(DATA_DIR, 'resident-system.db');

      // 確保資料目錄存在
      if (!fs.existsSync(DATA_DIR)) {
        fs.mkdirSync(DATA_DIR, { recursive: true });
      }

      const db = new Database(DB_PATH);
      db.pragma('journal_mode = WAL');
      db.pragma('foreign_keys = ON');

      export function initDatabase() {
        db.exec(`
          -- 狀態選項
          CREATE TABLE IF NOT EXISTS status_options (
            id TEXT PRIMARY KEY,
            type TEXT NOT NULL,
            label TEXT NOT NULL,
            color TEXT NOT NULL,
            sort_order INTEGER DEFAULT 0
          );

          -- 建築物
          CREATE TABLE IF NOT EXISTS buildings (
            id TEXT PRIMARY KEY,
            name TEXT NOT NULL,
            normal_floor_count INTEGER NOT NULL,
            rooftop_floor_count INTEGER DEFAULT 0,
            basement_floor_count INTEGER DEFAULT 0,
            created_at TEXT NOT NULL,
            updated_at TEXT NOT NULL
          );

          -- 停車位
          CREATE TABLE IF NOT EXISTS parking_spots (
            id TEXT PRIMARY KEY,
            building_id TEXT NOT NULL,
            floor TEXT NOT NULL,
            number TEXT NOT NULL,
            type TEXT NOT NULL,
            status_id TEXT NOT NULL,
            bound_resident_id TEXT,
            created_at TEXT NOT NULL,
            updated_at TEXT NOT NULL
          );

          -- 住戶
          CREATE TABLE IF NOT EXISTS residents (
            id TEXT PRIMARY KEY,
            building_id TEXT NOT NULL,
            floor TEXT NOT NULL,
            unit_type TEXT NOT NULL,
            unit_number TEXT,
            status_id TEXT NOT NULL,
            owner_name TEXT NOT NULL,
            renter_name TEXT,
            phone TEXT,
            email TEXT,
            move_in_date TEXT NOT NULL,
            move_out_date TEXT,
            deposit REAL,
            monthly_rent REAL,
            emergency_contact TEXT,
            emergency_phone TEXT,
            note TEXT,
            created_at TEXT NOT NULL,
            updated_at TEXT NOT NULL
          );

          -- 家庭成員
          CREATE TABLE IF NOT EXISTS resident_members (
            id TEXT PRIMARY KEY,
            resident_id TEXT NOT NULL,
            name TEXT NOT NULL,
            phone TEXT,
            relationship TEXT,
            created_at TEXT NOT NULL,
            FOREIGN KEY (resident_id) REFERENCES residents(id) ON DELETE CASCADE
          );

          -- 鑰匙卡
          CREATE TABLE IF NOT EXISTS resident_keycards (
            id TEXT PRIMARY KEY,
            resident_id TEXT NOT NULL,
            card_number TEXT NOT NULL,
            note TEXT,
            created_at TEXT NOT NULL,
            FOREIGN KEY (resident_id) REFERENCES residents(id) ON DELETE CASCADE
          );

          -- 收支類別
          CREATE TABLE IF NOT EXISTS expense_categories (
            id TEXT PRIMARY KEY,
            name TEXT NOT NULL,
            type TEXT NOT NULL,
            color TEXT,
            sort_order INTEGER DEFAULT 0
          );

          -- 支出記錄
          CREATE TABLE IF NOT EXISTS expense_records (
            id TEXT PRIMARY KEY,
            type TEXT NOT NULL,
            date TEXT NOT NULL,
            amount REAL NOT NULL,
            category_id TEXT NOT NULL,
            description TEXT,
            created_at TEXT NOT NULL,
            updated_at TEXT NOT NULL
          );

          -- 零用金持有人
          CREATE TABLE IF NOT EXISTS allowance_holders (
            id TEXT PRIMARY KEY,
            name TEXT NOT NULL,
            balance REAL DEFAULT 0,
            created_at TEXT NOT NULL,
            updated_at TEXT NOT NULL
          );

          -- 零用金交易
          CREATE TABLE IF NOT EXISTS allowance_transactions (
            id TEXT PRIMARY KEY,
            allowance_id TEXT NOT NULL,
            date TEXT NOT NULL,
            amount REAL NOT NULL,
            type TEXT NOT NULL,
            description TEXT,
            balance_after REAL NOT NULL,
            created_at TEXT NOT NULL,
            FOREIGN KEY (allowance_id) REFERENCES allowance_holders(id) ON DELETE CASCADE
          );

          -- 員工
          CREATE TABLE IF NOT EXISTS employees (
            id TEXT PRIMARY KEY,
            name TEXT NOT NULL,
            phone TEXT,
            is_active INTEGER DEFAULT 1,
            created_at TEXT NOT NULL,
            updated_at TEXT NOT NULL
          );

          -- 班別
          CREATE TABLE IF NOT EXISTS shift_statuses (
            id TEXT PRIMARY KEY,
            name TEXT NOT NULL,
            label TEXT NOT NULL,
            color TEXT NOT NULL,
            sort_order INTEGER DEFAULT 0
          );

          -- 班表記錄
          CREATE TABLE IF NOT EXISTS schedule_entries (
            id TEXT PRIMARY KEY,
            date TEXT NOT NULL,
            shift_id TEXT NOT NULL,
            assignee_id TEXT NOT NULL,
            notes TEXT,
            created_at TEXT NOT NULL,
            updated_at TEXT NOT NULL
          );

          -- 國定假日
          CREATE TABLE IF NOT EXISTS holidays (
            id TEXT PRIMARY KEY,
            date TEXT NOT NULL UNIQUE,
            name TEXT NOT NULL
          );

          -- 公告標籤
          CREATE TABLE IF NOT EXISTS home_tabs (
            id TEXT PRIMARY KEY,
            name TEXT NOT NULL,
            sort_order INTEGER NOT NULL,
            created_at TEXT NOT NULL,
            updated_at TEXT NOT NULL
          );

          -- 公告記錄
          CREATE TABLE IF NOT EXISTS home_records (
            id TEXT PRIMARY KEY,
            tab_id TEXT NOT NULL,
            title TEXT NOT NULL,
            content TEXT,
            created_at TEXT NOT NULL,
            updated_at TEXT NOT NULL
          );

          -- 創建索引
          CREATE INDEX IF NOT EXISTS idx_residents_building ON residents(building_id);
          CREATE INDEX IF NOT EXISTS idx_residents_floor ON residents(floor);
          CREATE INDEX IF NOT EXISTS idx_members_resident ON resident_members(resident_id);
          CREATE INDEX IF NOT EXISTS idx_keycards_resident ON resident_keycards(resident_id);
          CREATE INDEX IF NOT EXISTS idx_expenses_date ON expense_records(date);
          CREATE INDEX IF NOT EXISTS idx_schedules_date ON schedule_entries(date);
        `);

        // 插入預設狀態
        const defaultStatuses = [
          { id: 'status-normal', type: 'resident', label: '正常', color: '#22c55e', sort_order: 1 },
          { id: 'status-rental', type: 'resident', label: '出租中', color: '#3b82f6', sort_order: 2 },
          { id: 'status-vacant', type: 'resident', label: '空屋', color: '#f59e0b', sort_order: 3 },
          { id: 'parking-empty', type: 'parking', label: '空位', color: '#22c55e', sort_order: 1 },
          { id: 'parking-rented', type: 'parking', label: '已出租', color: '#3b82f6', sort_order: 2 },
        ];

        const insertStatus = db.prepare(`
          INSERT OR IGNORE INTO status_options (id, type, label, color, sort_order)
          VALUES (@id, @type, @label, @color, @sort_order)
        `);

        for (const status of defaultStatuses) {
          insertStatus.run(status);
        }

        console.log('資料庫初始化完成');
      }

      export { db };
      export default db;
      ```

      ### server/src/db/repository.ts
      建立 Repository 模式，提供 CRUD 操作：

      ```typescript
      import { db } from './index.js';

      function generateId(): string {
        return `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
      }

      // 住戶 Repository
      export const residentRepository = {
        getAll: () => {
          return db.prepare('SELECT * FROM residents ORDER BY floor, unit_number').all();
        },
        getById: (id: string) => {
          return db.prepare('SELECT * FROM residents WHERE id = ?').get(id);
        },
        create: (data: any) => {
          const id = generateId();
          const now = new Date().toISOString();
          db.prepare(`
            INSERT INTO residents (id, building_id, floor, unit_type, unit_number, status_id,
              owner_name, renter_name, phone, email, move_in_date, move_out_date,
              deposit, monthly_rent, emergency_contact, emergency_phone, note, created_at, updated_at)
