<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班表系統</title>
  <style id="styles"></style>
</head>
<body>
  <div id="app"></div>
  <div id="modals"></div>
  
  <script type="module">
    // ============================================================
    // CONFIG - 應用配置
    // ============================================================
    const CONFIG = {
      STORAGE_KEY: 'schedule-system-data',
      DEFAULT_STATUSES: [
        { id: '1', name: '病', color: '#ffcdd2', textColor: '#333', fontSize: '1rem' },
        { id: '2', name: '休', color: '#c8e6c9', textColor: '#333', fontSize: '1rem' },
        { id: '3', name: '事', color: '#fff9c4', textColor: '#333', fontSize: '1rem' },
        { id: '4', name: '代', color: '#bbdefb', textColor: '#333', fontSize: '1rem' }
      ]
    };

    // ============================================================
    // STATE - 應用狀態管理
    // ============================================================
    const PRESETS = {
      dark: {
        bg: '#0F0F1A', card: '#1A1A2E', cardAlt: '#252540',
        primary: '#6366F1', text: '#F1F5F9', border: 'rgba(255,255,255,0.1)'
      },
      ocean: {
        bg: '#0a1628', card: '#132039', cardAlt: '#1a3a5c',
        primary: '#00b4d8', text: '#caf0f8', border: 'rgba(255,255,255,0.1)'
      },
      purple: {
        bg: '#1a1625', card: '#2d2640', cardAlt: '#3d3455',
        primary: '#a855f7', text: '#eee', border: 'rgba(168,85,247,0.2)'
      },
      green: {
        bg: '#0a1a14', card: '#0f2922', cardAlt: '#143d2d',
        primary: '#10B981', text: '#eee', border: 'rgba(16,185,129,0.2)'
      },
      light: {
        bg: '#f8fafc', card: '#ffffff', cardAlt: '#e2e8f0',
        primary: '#6366F1', text: '#1e293b', border: '#e2e8f0'
      }
    };

    const createState = () => ({
      departments: [],
      staff: [],
      statuses: [...CONFIG.DEFAULT_STATUSES],
      holidays: [],
      saturdayColor: '#bbdefb',
      sundayColor: '#ffcdd2',
      holidayColor: '#fff9c4',
      saturdayTextColor: '#1565c0',
      sundayTextColor: '#c62828',
      holidayTextColor: '#c73e54',
      gridColor: '#333333',
      defaultStaffIds: [],
      monthlyStaff: {},
      scheduleData: {},
      theme: { ...PRESETS.dark }
    });

    let state = createState();

    const State = {
      _year: new Date().getFullYear(),
      _month: new Date().getMonth(),
      _deptId: null,
      _tab: 'dept',
      _selectedCell: null,

      get year() { return this._year; },
      get month() { return this._month; },
      get deptId() { return this._deptId; },
      get tab() { return this._tab; },
      get selectedCell() { return this._selectedCell; },

      setDept(id) {
        this._deptId = id || null;
        Renderer.all();
      },

      prevMonth() {
        if (this._month === 0) { this._month = 11; this._year--; }
        else { this._month--; }
        Renderer.all();
      },

      nextMonth() {
        if (this._month === 11) { this._month = 0; this._year++; }
        else { this._month++; }
        Renderer.all();
      },

      setTab(tab) {
        this._tab = tab;
        Renderer.all();
      },

      selectCell(staffId, day) {
        this._selectedCell = { staffId, day };
      },

      clearCell() {
        this._selectedCell = null;
      },

      get monthKey() {
        return `${this._year}-${this._month + 1}`;
      }
    };

    // ============================================================
    // UTILS - 工具函數
    // ============================================================
    const generateId = () => `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
    const getMonthKey = () => State.monthKey;
    const debounce = (fn, delay) => {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    };
    const isMobile = () => navigator.userAgent.match(/Mobi|Android|iPhone|iPad/i)
      ? true
      : window.matchMedia ? window.matchMedia('(max-width: 768px)').matches : false;
    const escapeHtml = (str) => {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    };
    const getDaysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
    const getDayOfWeek = (y, m, d) => new Date(y, m, d).getDay();
    const getHoliday = (y, m, d) => {
      const dateKey = `${y}/${m + 1}/${d}`;
      return state.holidays.find(h => h.date === dateKey);
    };

    // ============================================================
    // STORAGE - 持久化層
    // ============================================================
    const Storage = {
      save() {
        localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state));
      },
      
      load() {
        const saved = localStorage.getItem(CONFIG.STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            state = { ...createState(), ...parsed };
            Storage.runMigrations();
          } catch (e) {
            console.error('Load failed:', e);
          }
        }
      },

      exportJSON() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `班表備份_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      },

      validateImportData(data) {
        const required = ['departments', 'staff', 'statuses'];
        for (const key of required) {
          if (!Array.isArray(data[key])) {
            throw new Error(`無效的備份檔案：缺少 ${key} 資料`);
          }
        }
        return true;
      },

      importJSON(file, merge = false) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const imported = JSON.parse(e.target.result);
              this.validateImportData(imported);

              if (merge) {
                // Merge mode: combine data, avoid duplicates by ID
                const mergeArrayById = (target, source, idField = 'id') => {
                  const existingIds = new Set(target.map(item => item[idField]));
                  const newItems = source.filter(item => !existingIds.has(item[idField]));
                  return [...target, ...newItems];
                };

                state.departments = mergeArrayById(state.departments, imported.departments);
                state.staff = mergeArrayById(state.staff, imported.staff);
                state.statuses = mergeArrayById(state.statuses, imported.statuses);

                // Merge holidays
                const holidayDates = new Set(state.holidays.map(h => h.date));
                const newHolidays = (imported.holidays || []).filter(h => !holidayDates.has(h.date));
                state.holidays = [...state.holidays, ...newHolidays];

                // Merge monthlyStaff
                for (const monthKey of Object.keys(imported.monthlyStaff || {})) {
                  if (!state.monthlyStaff[monthKey]) {
                    state.monthlyStaff[monthKey] = imported.monthlyStaff[monthKey];
                  } else {
                    const existingIds = new Set(state.monthlyStaff[monthKey].staffIds);
                    const newIds = (imported.monthlyStaff[monthKey].staffIds || []).filter(id => !existingIds.has(id));
                    state.monthlyStaff[monthKey].staffIds = [...state.monthlyStaff[monthKey].staffIds, ...newIds];
                  }
                }

                // Merge scheduleData
                for (const key of Object.keys(imported.scheduleData || {})) {
                  if (!state.scheduleData[key]) {
                    state.scheduleData[key] = imported.scheduleData[key];
                  }
                }

                // Merge defaultStaffIds
                if (imported.defaultStaffIds) {
                  const existingDefault = new Set(state.defaultStaffIds);
                  const newDefaults = imported.defaultStaffIds.filter(id => !existingDefault.has(id));
                  state.defaultStaffIds = [...state.defaultStaffIds, ...newDefaults];
                }
              } else {
                // Replace mode
                state = { ...createState(), ...imported };
              }

              // Run migrations
              this.runMigrations();

              this.save();
              resolve();
            } catch (err) {
              reject(err);
            }
          };
          reader.onerror = () => reject(new Error('檔案讀取失敗'));
          reader.readAsText(file);
        });
      },

      runMigrations() {
        if (!state.statuses?.length) {
          state.statuses = [...CONFIG.DEFAULT_STATUSES];
        }
        for (const monthKey of Object.keys(state.monthlyStaff)) {
          const val = state.monthlyStaff[monthKey];
          if (Array.isArray(val)) {
            state.monthlyStaff[monthKey] = { staffIds: val, defaults: {} };
          } else if (val && !val.defaults) {
            val.defaults = {};
          }
        }
        if (!state.saturdayTextColor) state.saturdayTextColor = '#1565c0';
        if (!state.sundayTextColor) state.sundayTextColor = '#c62828';
        if (!state.holidayTextColor) state.holidayTextColor = '#c73e54';
        if (!state.defaultStaffIds) state.defaultStaffIds = [];
      }
    };

    // ============================================================
    // DATA - 資料操作
    // ============================================================
    const Data = {
      // 部門
      addDepartment(name, phone = '') {
        state.departments.push({ id: generateId(), name, phone });
        Storage.save();
      },
      
      deleteDepartment(id) {
        state.departments = state.departments.filter(d => d.id !== id);
        state.staff = state.staff.filter(s => s.deptId !== id);
        // Clean orphaned schedule data
        for (const key of Object.keys(state.scheduleData)) {
          const parts = key.split('-');
          if (parts.length >= 3 && !state.staff.find(s => s.id === parts[2])) {
            delete state.scheduleData[key];
          }
        }
        if (State.deptId === id) State.setDept(null);
        Storage.save();
      },
      
      // 人員
      addStaff(deptId, name, position = '', phone = '') {
        state.staff.push({ id: generateId(), deptId, name, position, phone });
        Storage.save();
      },
      
      deleteStaff(id) {
        state.staff = state.staff.filter(s => s.id !== id);
        // Clean schedule & monthlyStaff
        for (const key of Object.keys(state.scheduleData)) {
          if (key.includes(`-${id}-`)) delete state.scheduleData[key];
        }
        for (const monthKey of Object.keys(state.monthlyStaff)) {
          if (state.monthlyStaff[monthKey].staffIds) {
            state.monthlyStaff[monthKey].staffIds = state.monthlyStaff[monthKey].staffIds.filter(sid => sid !== id);
          }
          if (state.monthlyStaff[monthKey].defaults) {
            delete state.monthlyStaff[monthKey].defaults[id];
          }
        }
        Storage.save();
      },
      
      // 狀態
      addStatus(name, color, textColor, fontSize) {
        state.statuses.push({ id: generateId(), name, color, textColor: textColor || '#333', fontSize: fontSize || '1' });
        Storage.save();
      },
      
      updateStatusColor(id, color) {
        const status = state.statuses.find(s => s.id === id);
        if (status) {
          status.color = color;
          Storage.save();
        }
      },

      updateStatusName(id, name) {
        const status = state.statuses.find(s => s.id === id);
        if (status) {
          status.name = name;
          Storage.save();
        }
      },

      updateStatusTextColor(id, textColor) {
        const status = state.statuses.find(s => s.id === id);
        if (status) {
          status.textColor = textColor;
          Storage.save();
        }
      },

      updateStatusFontSize(id, fontSize) {
        const status = state.statuses.find(s => s.id === id);
        if (status) {
          status.fontSize = fontSize;
          Storage.save();
        }
      },

      deleteStatus(id) {
        if (state.statuses.length <= 1) return alert('至少需要一個狀態');
        state.statuses = state.statuses.filter(s => s.id !== id);
        // Clean schedule references
        for (const key of Object.keys(state.scheduleData)) {
          if (state.scheduleData[key].statusId === id) delete state.scheduleData[key];
        }
        Storage.save();
      },
      
      // 假期
      addHoliday(date, name) {
        state.holidays.push({ id: generateId(), date, name });
        Storage.save();
      },
      
      deleteHoliday(id) {
        state.holidays = state.holidays.filter(h => h.id !== id);
        Storage.save();
      },

      updateHolidayName(id, name) {
        const holiday = state.holidays.find(h => h.id === id);
        if (holiday) {
          holiday.name = name;
          Storage.save();
        }
      },

      // 班表
      setScheduleStatus(staffId, day, statusId) {
        const cellKey = `${getMonthKey()}-${staffId}-${day}`;
        if (statusId) {
          state.scheduleData[cellKey] = { statusId };
        } else {
          delete state.scheduleData[cellKey];
        }
        Storage.save();
      },
      
      getScheduleStatus(staffId, day) {
        const cellKey = `${getMonthKey()}-${staffId}-${day}`;
        return state.scheduleData[cellKey]?.statusId || null;
      },
      
      // 月度人員
      setMonthlyStaff(staffIds) {
        const monthKey = getMonthKey();
        if (!state.monthlyStaff[monthKey]) {
          state.monthlyStaff[monthKey] = { staffIds: [], defaults: {} };
        }
        state.monthlyStaff[monthKey].staffIds = staffIds;
        Storage.save();
      },

      getMonthlyStaff() {
        const monthKey = getMonthKey();
        const monthlyIds = state.monthlyStaff[monthKey]?.staffIds || [];
        const defaultIds = state.defaultStaffIds || [];
        const allIds = [...new Set([...defaultIds, ...monthlyIds])];
        return allIds;
      },

      getDefaultWorkStatus(staffId) {
        const monthKey = getMonthKey();
        return state.monthlyStaff[monthKey]?.defaults?.[staffId] || null;
      },

      setDefaultWorkStatus(staffId, statusId) {
        const monthKey = getMonthKey();
        if (!state.monthlyStaff[monthKey]) {
          state.monthlyStaff[monthKey] = { staffIds: [], defaults: {} };
        }
        if (!state.monthlyStaff[monthKey].defaults) {
          state.monthlyStaff[monthKey].defaults = {};
        }
        if (statusId) {
          state.monthlyStaff[monthKey].defaults[staffId] = statusId;
        } else {
          delete state.monthlyStaff[monthKey].defaults[staffId];
        }
        Storage.save();
      },
    };

    // ============================================================
    // EXPORT - 匯出功能
    // ============================================================
    const Export = {
      CSV() {
        const monthKey = getMonthKey();
        const daysInMonth = getDaysInMonth(State.year, State.month);
        const monthlyStaffIds = Data.getMonthlyStaff();
        const dept = state.departments.find(d => d.id === State.deptId);
        const deptStaff = state.staff.filter(s => s.deptId === State.deptId && monthlyStaffIds.includes(s.id));

        let csv = '\uFEFF';
        csv += `${dept?.name || ''},${dept?.phone || ''}\n`;
        csv += `${State.year}年${State.month + 1}月\n\n`;
        const dowNames = ['日', '一', '二', '三', '四', '五', '六'];
        csv += '姓名';
        for (let d = 1; d <= daysInMonth; d++) {
          const dow = getDayOfWeek(State.year, State.month, d);
          csv += `,${d}(${dowNames[dow]})`;
        }
        csv += '\n';

        for (const s of deptStaff) {
          const esc = (v) => v == null ? '' : `"${String(v).replace(/"/g, '""')}"`;
          csv += esc(s.name);
          for (let d = 1; d <= daysInMonth; d++) {
            const statusId = Data.getScheduleStatus(s.id, d);
            const status = statusId ? state.statuses.find(st => st.id === statusId) : null;
            csv += `,${esc(status ? status.name : '')}`;
          }
          csv += '\n';
        }

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `班表_${dept?.name || ''}_${State.year}年${State.month + 1}月.csv`;
        a.click();
        URL.revokeObjectURL(url);
      },

      HTML_TEMPLATE: `
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>{{TITLE}}</title>
  <style>
    body { font-family: "Microsoft JhengHei", system-ui, sans-serif; background: #f5f5f5; padding: 20px; }
    h1 { text-align: center; color: #333; }
    h2 { text-align: center; color: #666; margin-top: 0; }
    table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
    th, td { border: 1px solid #333; padding: 8px; text-align: center; }
    th { background: #e8e8e8; font-weight: bold; }
    td { font-weight: bold; }
    .name-cell { background: #e8e8e8; font-weight: bold; min-width: 80px; }
    .status-cell { font-size: 1rem; font-weight: bold; }
    th.date-header { min-width: 40px; }
    th.holiday { color: #c73e54; }
    th.saturday { color: #1565c0; }
    th.sunday { color: #c62828; }
  </style>
</head>
<body>
  <h1>{{DEPT_NAME}}</h1>
  <h2>{{MONTH}}</h2>
  <table>
    <thead>
      {{HEADER_DAY}}
      {{HEADER_HOLIDAY}}
    </thead>
    <tbody>
      {{ROWS}}
    </tbody>
  </table>
  <p style="text-align:center;color:#999;margin-top:20px;font-size:0.8rem;">匯出時間：{{EXPORT_TIME}}</p>
</body>
</html>`,

      buildHeaderDays(daysInMonth) {
        let html = '<tr><th class="name-cell">姓名</th>';
        const dowNames = ['日', '一', '二', '三', '四', '五', '六'];
        for (let d = 1; d <= daysInMonth; d++) {
          const dow = getDayOfWeek(State.year, State.month, d);
          const holiday = getHoliday(State.year, State.month, d);
          let cls = 'date-header';
          if (holiday) cls += ' holiday';
          else if (dow === 0) cls += ' sunday';
          else if (dow === 6) cls += ' saturday';
          html += `<th class="${cls}">${d}<br>${dowNames[dow]}</th>`;
        }
        return html + '</tr>';
      },

      buildHeaderHoliday(daysInMonth) {
        let html = '<tr><th class="name-cell"></th>';
        for (let d = 1; d <= daysInMonth; d++) {
          const dow = getDayOfWeek(State.year, State.month, d);
          const holiday = getHoliday(State.year, State.month, d);
          let bg = '#e8e8e8';
          if (holiday) bg = state.holidayColor;
          else if (dow === 0) bg = state.sundayColor;
          else if (dow === 6) bg = state.saturdayColor;
          const name = holiday ? holiday.name : '';
          const textColor = holiday ? state.holidayTextColor : (dow === 0 ? state.sundayTextColor : (dow === 6 ? state.saturdayTextColor : '#333'));
          html += `<th style="background:${bg};font-size:0.75rem;color:${textColor};">${escapeHtml(name)}</th>`;
        }
        return html + '</tr>';
      },

      buildStaffRow(staff, daysInMonth) {
        let html = `<tr><td class="name-cell">${escapeHtml(staff.name)}${staff.position ? '<br><small>' + escapeHtml(staff.position) + '</small>' : ''}</td>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const dow = getDayOfWeek(State.year, State.month, d);
          const holiday = getHoliday(State.year, State.month, d);
          const statusId = Data.getScheduleStatus(staff.id, d);
          const status = statusId ? state.statuses.find(st => st.id === statusId) : null;

          let bg = '#fff';
          if (status) bg = status.color;
          else if (holiday) bg = state.holidayColor;
          else if (dow === 0) bg = state.sundayColor;
          else if (dow === 6) bg = state.saturdayColor;

          const textColor = status ? (status.textColor || '#333') : (holiday ? state.holidayTextColor : (dow === 0 ? state.sundayTextColor : (dow === 6 ? state.saturdayTextColor : '#333')));
          const fontSize = status ? (status.fontSize || '1') + 'rem' : '1rem';

          html += `<td class="status-cell" style="background:${bg};color:${textColor};font-size:${fontSize};">${status ? status.name : ''}</td>`;
        }
        return html + '</tr>';
      },

      HTML() {
        const daysInMonth = getDaysInMonth(State.year, State.month);
        const monthlyStaffIds = Data.getMonthlyStaff();
        const dept = state.departments.find(d => d.id === State.deptId);
        const deptStaff = state.staff.filter(s => s.deptId === State.deptId && monthlyStaffIds.includes(s.id));

        const rows = deptStaff.map(s => this.buildStaffRow(s, daysInMonth)).join('');

        let html = this.HTML_TEMPLATE
          .replace('{{TITLE}}', `${escapeHtml(dept?.name || '')} 班表 - ${State.year}年${State.month + 1}月`)
          .replace('{{DEPT_NAME}}', escapeHtml(dept?.name || ''))
          .replace('{{MONTH}}', `${State.year}年${State.month + 1}月`)
          .replace('{{HEADER_DAY}}', this.buildHeaderDays(daysInMonth))
          .replace('{{HEADER_HOLIDAY}}', this.buildHeaderHoliday(daysInMonth))
          .replace('{{ROWS}}', rows)
          .replace('{{EXPORT_TIME}}', escapeHtml(new Date().toLocaleString('zh-TW')));

        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `班表_${dept?.name || ''}_${State.year}年${State.month + 1}月.html`;
        a.click();
        URL.revokeObjectURL(url);
      },

      JSON() {
        Storage.exportJSON();
      },

      batch() {
        const year = parseInt(document.getElementById('batchYear')?.value) || new Date().getFullYear();
        const from = parseInt(document.getElementById('batchFrom')?.value) || 1;
        const to = parseInt(document.getElementById('batchTo')?.value) || 12;
        const format = document.getElementById('batchFormat')?.value || 'csv';
        const selectedDepts = Array.from(document.querySelectorAll('.batch-dept:checked')).map(cb => cb.value);

        if (!selectedDepts.length) return alert('請至少選擇一個部門');
        if (from > to) return alert('月份範圍錯誤');

        if (format === 'html') {
          const tables = [];
          for (const deptId of selectedDepts) {
            const dept = state.departments.find(d => d.id === deptId);
            for (let month = from; month <= to; month++) {
              const daysInMonth = getDaysInMonth(year, month - 1);
              const monthlyIds = state.monthlyStaff[`${year}-${month}`]?.staffIds || state.defaultStaffIds || [];
              const deptStaff = state.staff.filter(s => s.deptId === deptId && monthlyIds.includes(s.id));

              if (!deptStaff.length) continue;

              const dowNames = ['日', '一', '二', '三', '四', '五', '六'];
              let headerHtml = `<tr><th class="name-cell">姓名</th>`;
              let holidayHtml = `<tr><th class="name-cell"></th>`;
              for (let d = 1; d <= daysInMonth; d++) {
                const dow = getDayOfWeek(year, month - 1, d);
                const holiday = getHoliday(year, month - 1, d);
                let cls = 'date-header';
                if (holiday) cls += ' holiday';
                else if (dow === 0) cls += ' sunday';
                else if (dow === 6) cls += ' saturday';
                headerHtml += `<th class="${cls}">${d}<br>${dowNames[dow]}</th>`;

                let hBg = '#e8e8e8', hColor = '#333';
                if (holiday) { hBg = state.holidayColor; hColor = state.holidayTextColor || '#c73e54'; }
                else if (dow === 6) { hBg = state.saturdayColor; hColor = state.saturdayTextColor || '#1565c0'; }
                else if (dow === 0) { hBg = state.sundayColor; hColor = state.sundayTextColor || '#c62828'; }
                holidayHtml += `<th style="background:${hBg};font-size:0.75rem;color:${hColor};">${escapeHtml(holiday?.name || '')}</th>`;
              }
              headerHtml += '</tr>';
              holidayHtml += '</tr>';

              let rowsHtml = '';
              for (const s of deptStaff) {
                rowsHtml += `<tr><td class="name-cell">${escapeHtml(s.name)}${s.position ? '<br><small>' + escapeHtml(s.position) + '</small>' : ''}</td>`;
                for (let d = 1; d <= daysInMonth; d++) {
                  const dow = getDayOfWeek(year, month - 1, d);
                  const holiday = getHoliday(year, month - 1, d);
                  const cellKey = `${year}-${month}-${s.id}-${d}`;
                  const statusId = state.scheduleData[cellKey]?.statusId
                    || (() => {
                      const mk = `${year}-${month}`;
                      return state.monthlyStaff[mk]?.defaults?.[s.id] || null;
                    })();
                  const status = statusId ? state.statuses.find(st => st.id === statusId) : null;

                  let bg = '#fff';
                  if (status) bg = status.color;
                  else if (holiday) bg = state.holidayColor;
                  else if (dow === 0) bg = state.sundayColor;
                  else if (dow === 6) bg = state.saturdayColor;

                  const textColor = status ? (status.textColor || '#333')
                    : (holiday ? state.holidayTextColor : (dow === 0 ? state.sundayTextColor : (dow === 6 ? state.saturdayTextColor : '#333')));
                  const fontSize = status ? (status.fontSize || '1') + 'rem' : '1rem';
                  rowsHtml += `<td style="background:${bg};color:${textColor};font-size:${fontSize};font-weight:bold;">${escapeHtml(status?.name || '')}</td>`;
                }
                rowsHtml += '</tr>';
              }

              tables.push(`<h2 style="text-align:center;color:#333;margin-top:32px;">${escapeHtml(dept?.name || '')} - ${year}年${month}月</h2>
                <table>
                  <thead>${holidayHtml}${headerHtml}</thead>
                  <tbody>${rowsHtml}</tbody>
                </table>`);
            }
          }

          const html = `<!DOCTYPE html>\n<html lang="zh-TW">\n<head>\n<meta charset="UTF-8">\n<title>班表批次匯出 ${year}/${from}-${to}</title>\n<style>\nbody{font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#f5f5f5;padding:20px;}\ntable{width:100%;border-collapse:collapse;background:white;margin-bottom:40px;box-shadow:0 2px 8px rgba(0,0,0,0.1);border-radius:8px;overflow:hidden;}\nth,td{border:1px solid #333;padding:6px;text-align:center;}\nth{background:#e8e8e8;font-weight:bold;}\ntd{font-weight:bold;}\n.name-cell{background:#e8e8e8;min-width:80px;}\n.status-cell{font-size:1rem;}\nth.date-header{min-width:36px;}\nh2{color:#333;}\n</style>\n</head>\n<body>\n<h1 style="text-align:center;color:#333;">${year}年 ${from}～${to}月 班表</h1>\n${tables.join('')}\n<p style="text-align:center;color:#999;font-size:0.8rem;margin-top:32px;">匯出時間：${escapeHtml(new Date().toLocaleString('zh-TW'))}</p>\n</body>\n</html>`;

          const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `班表批次_${year}年${from}-${to}月.html`;
          a.click();
          URL.revokeObjectURL(url);
        } else {
          // CSV batch
          const dowNames = ['日', '一', '二', '三', '四', '五', '六'];
          const esc = (v) => v == null ? '' : `"${String(v).replace(/"/g, '""')}"`;
          let csv = '\uFEFF';
          csv += `批次匯出,,${year}年${from}-${to}月\n\n`;

          for (const deptId of selectedDepts) {
            const dept = state.departments.find(d => d.id === deptId);
            csv += `${esc(dept?.name || '')}\n`;

            for (let month = from; month <= to; month++) {
              const daysInMonth = getDaysInMonth(year, month - 1);
              const monthlyIds = state.monthlyStaff[`${year}-${month}`]?.staffIds || state.defaultStaffIds || [];
              const deptStaff = state.staff.filter(s => s.deptId === deptId && monthlyIds.includes(s.id));

              if (!deptStaff.length) continue;

              csv += `${year}/${month}\n`;
              csv += '姓名';
              for (let d = 1; d <= daysInMonth; d++) {
                const dow = getDayOfWeek(year, month - 1, d);
                csv += `,${d}(${dowNames[dow]})`;
              }
              csv += '\n';

              for (const s of deptStaff) {
                csv += esc(s.name);
                for (let d = 1; d <= daysInMonth; d++) {
                  const cellKey = `${year}-${month}-${s.id}-${d}`;
                  const statusId = state.scheduleData[cellKey]?.statusId
                    || state.monthlyStaff[`${year}-${month}`]?.defaults?.[s.id] || null;
                  const status = statusId ? state.statuses.find(st => st.id === statusId) : null;
                  csv += `,${esc(status?.name || '')}`;
                }
                csv += '\n';
              }
              csv += '\n';
            }
          }

          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `班表批次_${year}年${from}-${to}月.csv`;
          a.click();
          URL.revokeObjectURL(url);
        }
      }
    };
    window.Export = Export;

        let html = '<table><thead>';

        html += '<tr><th class="name-cell" style="background:var(--card-alt);"></th>';
        for (let d = 1; d <= daysInMonth; d++) {
          const dow = getDayOfWeek(State.year, State.month, d);

          let hBg = 'var(--card-alt)';
          let hColor = 'var(--text)';
          if (holiday) { hBg = state.holidayColor; hColor = state.holidayTextColor || '#c73e54'; }
          else if (dow === 6) { hBg = state.saturdayColor; hColor = state.saturdayTextColor || '#1565c0'; }
          else if (dow === 0) { hBg = state.sundayColor; hColor = state.sundayTextColor || '#c62828'; }
          html += `<th style="font-size:0.85rem;color:${hColor};font-weight:700;padding:2px 4px;height:28px;background:${hBg};">${holiday ? holiday.name : ''}</th>`;

          const holiday = getHoliday(State.year, State.month, d);
          let hBg = 'var(--card-alt)';
          let hColor = 'var(--text)';
          if (holiday) { hBg = state.holidayColor; hColor = state.holidayTextColor || '#c73e54'; }
          else if (dow === 6) { hBg = state.saturdayColor; hColor = state.saturdayTextColor || '#1565c0'; }
          else if (dow === 0) { hBg = state.sundayColor; hColor = state.sundayTextColor || '#c62828'; }
          html += `<th style="font-weight:700;background:${hBg};color:${hColor};">${d}<br><small>${dowName}</small></th>`;

          for (let d = 1; d <= daysInMonth; d++) {
            const statusId = Data.getScheduleStatus(staff.id, d);

            const dow = getDayOfWeek(State.year, State.month, d);

            } else if (dow === 6) {
              bgColor = state.saturdayColor;

              bgColor = state.sundayColor;

            html += `<td style="background:${bgColor};${textStyle}"

          }
          html += '</tr>';
        }
        html += '</tbody></table>';
        container.innerHTML = html;

      bottom() {
        const dept = state.departments.find(d => d.id === State.deptId);
        const deptStaff = state.staff.filter(s => s.deptId === State.deptId);
        const monthlyStaffIds = Data.getMonthlyStaff();
        const workingStaff = deptStaff.filter(s => monthlyStaffIds.includes(s.id));

        const contactEl = document.getElementById('contactList');
        const statsEl = document.getElementById('statsList');
        if (contactEl) {
          contactEl.innerHTML = (dept?.phone ? `<p>${escapeHtml(dept.name)}: ${escapeHtml(dept.phone)}</p>` : '') +
            workingStaff.map(s => `<p>${escapeHtml(s.name)}: ${escapeHtml(s.phone || '無')}</p>`).join('');
        }
        if (statsEl) {
          const monthKey = getMonthKey();
          const daysInMonth = getDaysInMonth(State.year, State.month);
          const statsHtml = [`<p>出勤人數: <b>${workingStaff.length}</b></p>`];

          for (const staff of workingStaff) {
            const staffStatuses = [];
            for (let day = 1; day <= daysInMonth; day++) {
              const cellKey = `${monthKey}-${staff.id}-${day}`;
              const cell = state.scheduleData[cellKey];
              if (cell?.statusId) {
                const status = state.statuses.find(s => s.id === cell.statusId);
                if (status) {
                  staffStatuses.push(status);
                }
              }
            }

            // Count statuses for this staff
            const statusCounts = {};
            for (const s of staffStatuses) {
              statusCounts[s.name] = (statusCounts[s.name] || 0) + 1;
            }

            const statusBadges = Object.entries(statusCounts)
              .map(([name, count]) => {
                const status = state.statuses.find(s => s.name === name);
                const color = status?.color || '#ccc';
                return `<span style="display:inline-block;background:${color};color:#333;padding:2px 6px;border-radius:4px;margin-left:4px;font-size:0.8rem;">${name}:${count}</span>`;
              }).join('');

            statsHtml.push(`<p style="margin:4px 0;">${escapeHtml(staff.name)} ${statusBadges || '<span style="color:#999;font-size:0.8rem;">無</span>'}</p>`);
          }
          statsEl.innerHTML = statsHtml.join('');
        }
      },

    const _saveDebounced = debounce(() => Storage.save(), 500);

    // V4 統一假期來源 — 從 /api/holidays 拉取代 localStorage 的版本
    // 支援：
    //   1) 啟動時 fetch 同步（cold start）
    //   2) postMessage 接收 V4 React 推送（執行中即時更新）
    const HolidaySync = {
      // server YYYY-MM-DD → 本地 YYYY/M/D
      normalize(apiDate) {
        if (!apiDate) return '';
        if (apiDate.includes('/')) return apiDate; // 已是本地格式
        return apiDate.replace(/-/g, '/');
      },
      // 本地 YYYY/M/D → server YYYY-MM-DD
      denormalize(localDate) {
        if (!localDate) return '';
        if (localDate.includes('-')) return localDate;
        return localDate.replace(/\//g, '-');
      },
      async fetchFromServer() {
        try {
          const res = await fetch('/api/holidays');
          if (!res.ok) return null;
          const rows = await res.json();
          return rows.map(h => ({
            id: h.id,
            date: this.normalize(h.date),
            name: h.name,
            color: h.color || undefined,
          }));
        } catch (e) {
          console.warn('[HolidaySync] fetch failed (offline?)', e.message);
          return null;
        }
      },
      async syncFromServer() {
        const serverHolidays = await this.fetchFromServer();
        if (!serverHolidays) return false;
        // 完整替換（V4 為唯一來源）
        state.holidays = serverHolidays;
        return true;
      },
      // 接收 V4 React 推送
      setupMessageListener() {
        window.addEventListener('message', (ev) => {
          const msg = ev.data;
          if (!msg || typeof msg !== 'object') return;
          if (msg.type === 'v4-holidays' && Array.isArray(msg.holidays)) {
            state.holidays = msg.holidays.map(h => ({
              id: h.id,
              date: this.normalize(h.date),
              name: h.name,
              color: h.color || undefined,
            }));
            Renderer.all();
          }
        });
      },
    };

    window.App = {
      init() {
        Storage.load();
        HolidaySync.setupMessageListener();
        // 啟動時背景 sync（不等 — 用戶先看到 localStorage 內容）
        HolidaySync.syncFromServer().then((ok) => {
          if (ok) Renderer.all();
        });
        Theme.apply();
        document.documentElement.style.setProperty('--is-mobile', isMobile() ? '1' : '0');
        Renderer.all();
        Modals.status();
      },
      
      render() {
        Renderer.all();
      },

      async refreshHolidays() {

          return true;
        }
        return false;

      // 假期
      addHoliday() {
        const date = document.getElementById('holidayDate')?.value.trim();
        const name = document.getElementById('holidayName')?.value.trim();
        if (!date || !name) return alert('請填寫日期和名稱');
        Data.addHoliday(date, name);
        Renderer.all();
      },

      addHolidayBatch() {
        const text = document.getElementById('holidayBatch')?.value.trim();
        if (!text) return alert('請輸入假期資料');
        const lines = text.split('\n').filter(l => l.trim());
        let count = 0;
        for (const line of lines) {
          const parts = line.split(/[\t,，]/);
          if (parts.length >= 2) {
            const date = parts[0].trim();
            const name = parts.slice(1).join(' ').trim();
            if (date && name) {
              Data.addHoliday(date, name);
              count++;
            }
          }
        }
        if (count > 0) {
          document.getElementById('holidayBatch').value = '';
          Renderer.all();
          alert(`已新增 ${count} 筆假期`);
        } else {
          alert('格式錯誤，請使用「日期	名稱」格式');
        }
      },

      selectStatus(statusName) {
        if (!State.selectedCell) return;
        const { staffId, day } = State.selectedCell;

        if (statusName === null) {
          Data.setScheduleStatus(staffId, day, null);
        } else {
          const status = state.statuses.find(s => s.name === statusName);
          if (status) {
            Data.setScheduleStatus(staffId, day, status.id);
          }
        }

        Modals.hideStatusModal();
        Renderer.table();
        Renderer.bottom();
      },
      
      // 出勤人員
      showStaffModal() {
        Modals.showStaffModal();
      },
      
      closeStaffModal() {
        const selectedIds = Array.from(document.querySelectorAll('#staffList input:checked'))
          .map(cb => cb.value);
        Data.setMonthlyStaff(selectedIds);
        Modals.hideStaffModal();
        Renderer.all();

      _toggleDefaultStaff(staffId, checked) {
        if (checked) {
          if (!state.defaultStaffIds.includes(staffId)) {
            state.defaultStaffIds.push(staffId);
          }
        } else {
          state.defaultStaffIds = state.defaultStaffIds.filter(id => id !== staffId);
        }
        Storage.save();
        Renderer.table();
      },

      _checkAllDaysWork(staffId) {
        const monthKey = getMonthKey();
        const daysInMonth = getDaysInMonth(State.year, State.month);
        for (let day = 1; day <= daysInMonth; day++) {
          const cellKey = `${monthKey}-${staffId}-${day}`;
          if (!state.scheduleData[cellKey]) {
            return false;
          }
        }
        return true;
      },

      _setDefaultAllDays(staffId) {
        const statusId = Data.getDefaultWorkStatus(staffId);
        if (!statusId) {
          return alert('請先選擇預設狀態');
        }
        const monthKey = getMonthKey();
        const daysInMonth = getDaysInMonth(State.year, State.month);
        for (let day = 1; day <= daysInMonth; day++) {
          const cellKey = `${monthKey}-${staffId}-${day}`;
          state.scheduleData[cellKey] = { statusId: statusId };
        }
        Storage.save();
        this.showStaffModal();
        Renderer.table();
      },

      _onStatusSelect(staffId, statusId) {
        Data.setDefaultWorkStatus(staffId, statusId || null);
      },

      _onStaffCheck(staffId, checked) {
        const monthlyStaffIds = Data.getMonthlyStaff();
        if (checked && !monthlyStaffIds.includes(staffId)) {
          monthlyStaffIds.push(staffId);
        } else if (!checked) {
          const idx = monthlyStaffIds.indexOf(staffId);
          if (idx > -1) monthlyStaffIds.splice(idx, 1);
        }
        Data.setMonthlyStaff(monthlyStaffIds);
      },

      // 匯入
      async importData() {
        const file = document.getElementById('importFile')?.files[0];
        if (!file) return alert('請選擇檔案');

        const action = prompt('匯入選項：\n1. 完全取代（刪除現有資料）\n2. 合併（保留現有資料）\n\n請輸入 1 或 2：');

        if (!action) return;
        const isMerge = action.trim() === '2';

        if (!isMerge) {
          const confirm = prompt('警告：完全取代會刪除所有現有資料！\n\n請輸入「確定」確認取代：');
          if (confirm !== '確定') {
            alert('已取消匯入');
            return;
          }
        }

        try {
          await Storage.importJSON(file, isMerge);
          Renderer.all();
          alert(`匯入成功（${isMerge ? '合併' : '取代'}模式）`);
        } catch (err) {
          alert('匯入失敗: ' + err.message);
        }
      },

        document.getElementById('importFile').click();

        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        transition: var(--transition);
        font-weight: 600;
      }
      nav button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
      }

      .month-nav { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
      .month-nav button {
        padding: 10px 20px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-primary);
        border-radius: var(--radius);
        cursor: pointer;
        transition: var(--transition);
      }
      .month-nav button:hover {
        background: var(--bg-light);
        border-color: var(--primary);
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
      }
      .month-nav span { font-size: 1.3rem; font-weight: 700; color: var(--text-primary); }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
      }
      th, td { border: 1px solid var(--gridColor); padding: 8px; text-align: center; }
      th {
        background: var(--bg-light);
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-primary);
      }
      td {
        cursor: pointer;
        min-width: var(--cell-min-w, 48px);
        height: 52px;
        font-size: 1rem;
        font-weight: 700;
        transition: var(--transition);
        background: var(--bg-medium);
        text-align: center;
        vertical-align: middle;
        line-height: 1;
        color: var(--text-primary);
      }
      td:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        z-index: 1;
        position: relative;
        background: var(--bg-light);
      }
      th { text-align: center; vertical-align: middle; }
      td.name-cell, th.name-cell {
        background: var(--bg-light);
        min-width: var(--name-min-w, 100px);
        cursor: default;
        vertical-align: middle;
      }
      td.name-cell:hover { opacity: 1; }
      th.name-cell { font-size: 0.9rem; }
      .staff-name { font-weight: 800; font-size: 1rem; color: var(--primary); }
      .staff-position { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-top: 2px; }

      .bottom { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 16px; margin-top: 20px; }
      .bottom-section {
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        padding: 20px;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        transition: var(--transition);
      }
      .bottom-section:hover { border-color: var(--primary); }
      .bottom-section h3 {
        margin-bottom: 12px;
        color: var(--primary);
        font-weight: 600;
        font-size: 1rem;
      }

      .export-section {
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        padding: 20px;
        border-radius: var(--radius-lg);
        margin-top: 20px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
      }
      .export-section button {
        padding: 12px 28px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        border: none;
        color: #fff;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        transition: var(--transition);
      }
      .export-section button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
      }

      .settings {
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        padding: 24px;
        border-radius: var(--radius-lg);
        margin-top: 20px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
      }
      .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
      .settings-section {
        background: var(--bg-glass);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        transition: var(--transition);
      }
      .settings-section:hover { border-color: var(--primary); }
      .settings-section h3 {
        margin-bottom: 16px;
        color: var(--primary);
        font-weight: 600;
        font-size: 0.95rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
      }
      .settings-section input[type="text"],
      .settings-section input[type="number"],
      .settings-section select,
      .settings-section textarea {
        width: 100%;
        padding: 10px 14px;
        margin-bottom: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-dark);
        color: var(--text-primary);
        transition: var(--transition);
        font-size: 14px;
      }
      .settings-section input:focus,
      .settings-section select:focus,
      .settings-section textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      }
      .settings-section button {
        padding: 10px 20px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        border: none;
        color: #fff;
        border-radius: var(--radius);
        cursor: pointer;
        margin-right: 8px;
        margin-top: 8px;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        transition: var(--transition);
        font-weight: 600;
      }
      .settings-section button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
      }
      .settings-section ul { list-style: none; margin-top: 12px; }
      .settings-section li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px;
        background: var(--bg-dark);
        margin-bottom: 6px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        transition: var(--transition);
        color: var(--text-primary);
      }
      .settings-section li:hover { border-color: var(--primary); }
      .settings-section li button {
        padding: 6px 12px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        margin: 0;
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
      }
      .settings-section li button.delete {
        background: linear-gradient(135deg, var(--error) 0%, #b91c1c 100%);
      }
      .settings-section li button.delete:hover {
        box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
      }
      .settings-section input[type="color"] {
        width: 36px;
        height: 36px;
        padding: 2px;
        border: 2px solid var(--border);
        cursor: pointer;
        border-radius: var(--radius);
        background: var(--bg-dark);
      }
      .settings-section input[type="color"]:hover { border-color: var(--primary); }

      .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
      .tab {
        padding: 12px 24px;
        background: var(--bg-glass);
        border: 1px solid transparent;
        color: var(--text-secondary);
        border-radius: var(--radius) var(--radius) 0 0;
        cursor: pointer;
        transition: var(--transition);
        font-weight: 600;
        font-size: 14px;
      }
      .tab:hover {
        background: var(--bg-light);
        color: var(--text-primary);
        border-color: var(--border);
      }
      .tab.active {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal-overlay.show { display: flex; }
      .modal {
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        padding: 28px;
        border-radius: var(--radius-xl);
        min-width: 320px;
        max-width: 90vw;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border);
      }
      .modal h3 {
        margin-bottom: 20px;
        font-size: 1.2rem;
        color: var(--primary);
        font-weight: 700;
      }
      .modal-buttons { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
      .modal-buttons button {
        padding: 14px;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        transition: var(--transition);
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      }
      .modal-buttons button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
      }
      .modal button.cancel {
        width: 100%;
        padding: 12px;
        background: var(--bg-glass);
        color: var(--text-primary);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        transition: var(--transition);
        font-weight: 600;
      }
      .modal button.cancel:hover {
        background: var(--bg-light);
        border-color: var(--primary);
      }

      .staff-list { max-height: 350px; overflow-y: auto; margin-bottom: 16px; padding: 8px; }
      .staff-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: var(--bg-glass);
        backdrop-filter: blur(10px);
        margin-bottom: 6px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        transition: var(--transition);
      }
      .staff-item:hover {
        border-color: var(--primary);
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.15);
        background: var(--bg-light);
      }
      .staff-item input[type="checkbox"] {
        width: 20px;
        height: 20px;
        accent-color: var(--primary);
        cursor: pointer;
      }
      .staff-item .default-label {
        font-size: 0.8rem;
        color: var(--text-secondary);
        white-space: nowrap;
      }
      .staff-item .default-label input[type="checkbox"] {
        width: 16px;
        height: 16px;
      }

      .empty-msg { text-align: center; padding: 60px; color: var(--text-muted); font-size: 1rem; }
      .preset-buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
      .preset-btn {
        padding: 14px 24px;
        border: 2px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: var(--transition);
        background: var(--bg-glass);
        color: var(--text-primary);
      }
      .preset-btn:hover { transform: scale(1.05); border-color: var(--primary); }
      .preset-btn.active {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3), 0 8px 25px rgba(99, 102, 241, 0.3);
        background: var(--bg-light);
      }
      .flex-center { display: flex; align-items: center; gap: 8px; }
      .flex-wrap { flex-wrap: wrap; gap: 6px; }
      .input-field { padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); color: var(--text); }
      .input-full { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); resize: vertical; }
      .input-sm { padding: 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); color: var(--text); font-size: 0.75rem; }
      .label-sm { font-size: 0.8rem; }
      .label-xs { font-size: 0.7rem; }
      .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
      .mb-8 { margin-bottom: 8px; }
      .mt-8 { margin-top: 8px; }
      * { font-family: "Microsoft JhengHei", "Microsoft YaHei", system-ui, sans-serif; }
      body, input, button, select, textarea { font-weight: 500; }
      h1, h2, h3, th, .staff-name { font-weight: 700; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: var(--bg-dark); border-radius: 4px; }
      ::-webkit-scrollbar-thumb { background: var(--bg-light); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
      @media (max-width: 768px) {
        :root { --cell-min-w: 36px; --name-min-w: 70px; }
        .bottom { grid-template-columns: 1fr; }
        nav { flex-wrap: wrap; gap: 8px; }
        nav h1 { min-width: unset; }
        nav .dept-center { order: 3; width: 100%; }
        nav .dept-center select { width: 100%; }
      }
    `;

    document.getElementById('styles').textContent = STYLES;
    App.init();
  </script>
</body>
</html>
