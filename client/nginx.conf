# V4 Client — nginx config
#
# - SPA fallback: every non-asset path → /index.html
# - /api/*       → reverse proxy to the `api` docker-compose service on port 3001
# - gzip on for common text types (saves bandwidth on a 1-2 MB JS bundle)
# - long cache for fingerprinted assets under /assets/

upstream v4_api {
    server api:3001;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (reasonable defaults; tighten in production)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        font/ttf
        font/otf
        image/svg+xml;

    # Long-cache fingerprinted assets
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Public fonts (built by build:font step, fingerprinted in name)
    location /fonts/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API reverse proxy → `api` service in docker-compose
    location /api/ {
        proxy_pass http://v4_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # SPA fallback: anything not matched above serves index.html
    # (this includes the vite-built root /)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html aggressively (so deploys are picked up)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Health endpoint for docker
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
